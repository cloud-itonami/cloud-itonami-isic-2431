name: CI

# :local/root paths only resolve inside the monorepo checkout, so the test
# job reconstructs the workspace layout by checking out siblings (all
# PUBLIC) into the expected relative paths -- no token needed. Same
# pattern as cloud-itonami-isic-0111 / cloud-itonami-isic-869.
# physics-2d is pinned via :git/sha (not :local/root), so it resolves
# straight from GitHub -- no sibling checkout needed for it. robotics
# itself declares :local/root deps on html/css, so those need siblings
# too even though this repo's own code never touches them directly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: clojure -M:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: orgs/cloud-itonami/cloud-itonami-isic-2431 }
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langgraph
          path: orgs/kotoba-lang/langgraph
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langchain
          path: orgs/kotoba-lang/langchain
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/robotics
          path: orgs/kotoba-lang/robotics
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/html
          path: orgs/kotoba-lang/html
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/css
          path: orgs/kotoba-lang/css
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - name: test
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-2431
        run: clojure -M:dev:test
      - name: demo runner (compiled StateGraph, end-to-end)
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-2431
        run: clojure -M:dev:run
